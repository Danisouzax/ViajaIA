<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viaja.AI</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <header>
      <h1>Viaja<span>.AI</span></h1>
      <p>Seu assistente de viagens com inteligência artificial</p>
    </header>

    <main>
      <form id="travel-form">
        <label for="climate">Clima preferido:</label>
        <select id="climate">
          <option value="quente">Quente</option>
          <option value="frio">Frio</option>
        </select>

        <label for="interests">Interesses:</label>
        <input type="text" id="interests" placeholder="praia, cultura..." />

        <label for="date">Data da viagem:</label>
        <input type="date" id="date" />

        <button type="submit">Encontrar destino ideal</button>
      </form>

      <div id="resultado"></div>


      <div id="result"></div>
    </main>
  </div>

  <script src="script.js"></script>
</body>

</html>
