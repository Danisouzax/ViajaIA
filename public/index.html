<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viaja.AI</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <header>
      <h1>Viaja<span>.AI</span></h1>
      <p>Seu assistente de viagens com inteligência artificial</p>
    </header>

    <main>
      <form id="travel-form">
        <label for="climate">Clima preferido:</label>
        <select id="climate">
          <option value="quente">Quente</option>
          <option value="frio">Frio</option>
        </select>

        <label for="interests">Interesses:</label>
        <input type="text" id="interests" placeholder="praia, cultura..." />

        <label for="date">Data da viagem:</label>
        <input type="date" id="date" />

        <button type="submit">Encontrar destino ideal</button>
      </form>

      <div id="resultado" class="resultado-card"></div>

    </main>
  </div>

  <!-- <script src="script.js"></script> -->

  <script type="module">
    import { pipeline } from "https://cdn.jsdelivr.net/npm/@xenova/transformers/dist/transformers.min.js";

    // carrega modelo GPT-2 (leve e rápido)
    const generator = await pipeline("text-generation", "gpt2");

    document.getElementById("travel-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const clima = document.getElementById("climate").value;
      const interesses = document.getElementById("interests").value;
      const data = document.getElementById("date").value;

      const prompt = `Sugira um destino de viagem com clima ${clima}, interesse em ${interesses} e data da viagem em ${data}.`;

      // mostra mensagem enquanto carrega
      const resultadoDiv = document.getElementById("resultado");
      resultadoDiv.innerHTML = "<p>Gerando sugestão...</p>";

      try {
        const output = await generator(prompt, { max_length: 50 });
        resultadoDiv.innerHTML = `
        <div class="resultado-card">
          <h3>Sugestão de Destino</h3>
          <p>${output[0].generated_text}</p>
        </div>
      `;
      } catch (error) {
        console.error(error);
        resultadoDiv.innerHTML = "<p style='color:red;'>Erro ao gerar sugestão.</p>";
      }
    });
  </script>
</body>

</html>
